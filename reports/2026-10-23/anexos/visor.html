 Joya", "persecución", "Camaná", "OVNI"], "resumen": "Relato minuto a minuto de la intercepción: los disparos no afectan al objeto, que acelera, sube y se empareja con el avión hasta que el piloto debe volver por falta de combustible.", "confianza": "alta"}, {"id": 3, "inicio": 621, "fin": 760, "tipo": "tema", "tema": "Debriefing y testigos del evento", "subtemas": [], "palabras_clave": ["radar", "antiaéreos", "misiles", "18 testigos"], "resumen": "El radar no detectó el objeto, aunque fue visto desde tierra por artilleros y operadores de misiles; se habla de 18 testigos.", "confianza": "alta"}, {"id": 4, "inicio": 760, "fin": 930, "tipo": "reflexion", "tema": "Qué sintió y cómo lo interpretó", "subtemas": [{"inicio": 760, "titulo": "Sorpresa durante el ataque"}, {"inicio": 830, "titulo": "No figura en los catálogos de armas: se clasifica como OVNI"}, {"inicio": 853, "titulo": "Durante meses llevó una mochila por si 'lo invitaban a irse'"}, {"inicio": 895, "titulo": "Video que ilustra el movimiento del objeto"}], "palabras_clave": ["emoción", "catálogo de armas", "objeto no identificado"], "resumen": "Pasa de pensar en una tecnología humana desconocida a aceptar que era un OVNI; muestra un video parecido a lo que vio.", "confianza": "media"}, {"id": 5, "inicio": 930, "fin": 1138, "tipo": "tema", "tema": "Difusión del caso: de 21 años de silencio a Washington", "subtemas": [{"inicio": 930, "titulo": "46 aniversario y su investigación personal"}, {"inicio": 983, "titulo": "La FAP crea su oficina OVNI (2001); primeras entrevistas en prensa y TV"}, {"inicio": 1027, "titulo": "Conferencia de Washington 2007: documento del Departamento de Defensa"}, {"inicio": 1112, "titulo": "Documental de History Channel (2008)"}], "palabras_clave": ["Leslie Kean", "James Fox", "Washington", "desclasificación"], "resumen": "El caso se mantuvo dentro de la Fuerza Aérea durante 21 años; desde 2001 se hizo público y en 2007 un documento de EE. UU. lo respaldó.", "confianza": "alta"}, {"id" blia"], "resumen": "Cómo responde a los escépticos: si Dios no es de la Tierra, también puede haber vida extraterrestre.", "confianza": "alta"}, {"id": 15, "inicio": 2614, "fin": 2703, "tipo": "tema", "tema": "Hombres de negro y Majestic 12", "subtemas": [], "palabras_clave": ["hombres de negro", "Majestic 12", "desinformación", "Guerra Fría"], "resumen": "No lo buscaron hombres de negro; explica el MJ-12 como un aparato de desinformación nacido en la Guerra Fría.", "confianza": "alta"}, {"id": 16, "inicio": 2703, "fin": 2853, "tipo": "reflexion", "tema": "Qué le diría a su yo de 23 años y qué les preguntaría", "subtemas": [{"inicio": 2703, "titulo": "Cumplió la misión; hoy no atacaría"}, {"inicio": 2816, "titulo": "Preguntaría por la paz y la calidad de vida"}], "palabras_clave": ["reflexión", "paz", "calidad de vida"], "resumen": "Volvería a cumplir la misión, pero hoy intentaría dialogar en vez de atacar; les preguntaría cómo lograr paz y salud.", "confianza": "alta"}, {"id": 17, "inicio": 2853, "fin": 2883, "tipo": "publicidad", "tema": "Publicidad integrada: Olimpo.bet", "subtemas": [], "palabras_clave": ["Olimpo.bet", "sponsor"], "resumen": "Sketch de 'concentración paranormal' que termina en números para un casino en línea.", "confianza": "alta"}, {"id": 18, "inicio": 2883, "fin": 3084, "tipo": "recomendacion", "tema": "Agradecimiento y grupos de investigación OVNI", "subtemas": [{"inicio": 2883, "titulo": "Agradecimiento del conductor"}, {"inicio": 2923, "titulo": "Recomendación: grupos UFO/UAP en internet"}], "palabras_clave": ["grupos de investigación", "Uruguay", "UAP", "biblioteca OVNI"], "resumen": "El invitado recomienda unirse a grupos internacionales de investigación OVNI y cuenta que tiene un archivo de unos 2000 videos.", "confianza": "media"}, {"id": 19, "inicio": 3084, "fin": 3186, "tipo": "cierre", "tema": "Despedida", "subtemas": [], "palabras_clave": ["despedida", "invitación a repetir"], "resumen": "Agradecimientos mutuos, propuesta de repeti nicio": 4993, "titulo": "Cámaras y la 'distopía orwelliana' que luego adopta Occidente"}], "palabras_clave": ["TikTok", "Douyin", "algoritmo", "Facebook", "datos", "cámaras"], "resumen": "Rechaza que el gobierno use Douyin para adoctrinar; el bloqueo de apps occidentales anticipó leyes de datos que hoy pide Europa, y China funciona como laboratorio de lo que luego se adopta.", "confianza": "alta"}, {"id": 24, "inicio": 5033, "fin": 5337, "tipo": "tema", "tema": "El desconocimiento mutuo entre China y Occidente", "subtemas": [{"inicio": 5033, "titulo": "¿Qué sabe de España un joven de Shanghái?"}, {"inicio": 5135, "titulo": "Su firewall es impuesto; el nuestro, voluntario"}, {"inicio": 5282, "titulo": "El país que más afecta a nuestras vidas"}], "palabras_clave": ["España", "Zhejiang", "firewall", "desconocimiento", "Chengdu"], "resumen": "Muchos chinos no ubican España, pero los occidentales tampoco saben nada de China pese a ser el país que más afecta a sus vidas; nuestra ignorancia es voluntaria.", "confianza": "alta"}, {"id": 25, "inicio": 5337, "fin": 5729, "tipo": "tema", "tema": "Taiwán", "subtemas": [{"inicio": 5337, "titulo": "Cada semana China 'va a invadir Taiwán'"}, {"inicio": 5413, "titulo": "Kissinger, Zhou Enlai y la Revolución Francesa"}, {"inicio": 5509, "titulo": "Los taiwaneses se consideran chinos"}, {"inicio": 5626, "titulo": "2049, centenario de la República Popular, como fecha límite"}, {"inicio": 5650, "titulo": "China ya controla los chips de Taiwán"}], "palabras_clave": ["Taiwán", "Kissinger", "Zhou Enlai", "chips", "2049"], "resumen": "China puede esperar a que Taiwán se una por interés económico; ya recibe más del 90 % de sus chips y quien quiere el conflicto es EE. UU.", "confianza": "alta"}, {"id": 26, "inicio": 5729, "fin": 5975, "tipo": "tema", "tema": "Imperialismo, guerras y rivales de China", "subtemas": [{"inicio": 5729, "titulo": "China nunca ha sido expansionista"}, {"inicio": 5787, "titulo": "Pronóstico a 3 a 5 años: cero guerras"}, {"inicio": 5875, "titulo": "No odian a EE. UU.: el rival natural es Rusia"}, {"inicio": 5938, "titulo": "El búnker pensado contra la Unión Soviética"}], "palabras_clave": ["imperialismo", "Ucrania", "Irán", "Rusia", "Robert Kaplan", "EE. UU."], "resumen": "Prevé cero guerras con participación china a corto plazo; sus conflictos son con vecinos y su rival histórico es Rusia, no EE. UU., a quien admiran.", "confianza": "alta"}, {"id": 27, "inicio": 5975, "fin": 6269, "tipo": "tema", "tema": "Salud, hábitos y generaciones", "subtemas": [{"inicio": 5975, "titulo": "Menos tabaco, más gimnasios y comida sana"}, {"inicio": 6040, "titulo": "Generaciones desplazadas y cinco generaciones bajo un techo"}, {"inicio": 6131, "titulo": "Drogas, graffiti y niños sin infancia"}, {"inicio": 6184, "titulo": "El consumo de baijiu"}], "palabras_clave": ["salud", "tabaco", "gimnasios", "drogas", "baijiu", "generaciones"], "resumen": "Los hábitos cambian rápido; las generaciones van desfasadas respecto a Occidente, las drogas son casi inexistentes y el consumo de alcohol es enorme.", "confianza": "alta"}, {"id": 28, "inicio": 6269, "fin": 6629, "tipo": "tema", "tema": "¿Comen perro? Estereotipos y prensa occidental", "subtemas": [{"inicio": 6269, "titulo": "La pregunta del perro y la respuesta contextualizada"}, {"inicio": 6289, "titulo": "La prensa occidental y las verdades descontextualizadas"}, {"inicio": 6547, "titulo": "La foto del burro que su mujer no le dejó publicar"}], "palabras_clave": ["perro", "Guangdong", "prensa occidental", "estereotipos", "redes sociales"], "resumen": "Casi ningún chino ha comido perro: es un festival local que las redes amplifican; la desinformación es culpa a medias del gobierno chino y de la prensa occidental.", "confianza": "alta"}, {"id": 29, "inicio": 6629, "fin": 6903, "tipo": "tema", "tema": "El fenómeno influencer en China", "subtemas": [{"inicio": 6629, "titulo": "Confiar en quien prevalida: influencers antes que anuncios"}, {"inicio": 6824, "titulo": "Douyin y Xiaohongshu para vender"}, {"inicio": 6860, "titulo": "¿Es legal el porno?"}], "palabras_clave": ["influencers", "Douyin", "Xiaohongshu", "publicidad", "porno"], "resumen": "En China los influencers sustituyeron a la publicidad años antes que en Occidente, con cuentas de 100 a 200 millones de seguidores; el porno y la prostitución son ilegales pero existen.", "confianza": "media"}, {"id": 30, "inicio": 6903, "fin": 7302, "tipo": "tema", "tema": "Indicadores avanzados: microseries, drones y trenes", "subtemas": [{"inicio": 6903, "titulo": "Series de un minuto"}, {"inicio": 6975, "titulo": "Drones de pasajeros y de carga"}, {"inicio": 7108, "titulo": "El valor de una vida y la sanidad 'gratuita'"}, {"inicio": 7227, "titulo": "El tren China-Europa y la alta velocidad"}], "palabras_clave": ["indicadores avanzados", "microseries", "drones", "alta velocidad", "Ruta de la Seda"], "resumen": "Lo que hoy pasa en China llega después a Occidente: microseries, drones de pasajeros y de carga; toda sociedad calcula cuánto vale una vida.", "confianza": "alta"}, {"id": 31, "inicio": 7302, "fin": 7525, "tipo": "tema", "tema": "Su trabajo actual y el relevo del sureste asiático", "subtemas": [{"inicio": 7302, "titulo": "Traslado de fábricas de China al sureste asiático por los aranceles"}, {"inicio": 7362, "titulo": "¿Dónde apostaría su dinero? Vietnam"}, {"inicio": 7473, "titulo": "Indonesia, Malasia y Singapur: la diáspora china"}], "palabras_clave": ["sureste asiático", "aranceles", "Vietnam", "Indonesia", "Singapur", "tigres asiáticos"], "resumen": "Hoy traslada fábricas de China a Tailandia y otros países para esquivar aranceles; no apostaría por EE. UU. y ve en Vietnam la China de hace 20 años.", "confianza": "alta"}, {"id": 32, "inicio": 7525, "fin": 7661, "tipo": "tema", "tema": "El idioma: inglés, mandarín y dialectos", "subtemas": [], "palabras_clave": ["mandarín", "dialectos", "inglés", "Shanghái"], "resumen": "Aprendió chino en la calle y solo lo hab , "inicio": 8374, "fin": 8537, "tipo": "reflexion", "tema": "Lo mejor y lo peor de la cultura china: la competitividad", "subtemas": [{"inicio": 8374, "titulo": "La competitividad como virtud y como condena"}, {"inicio": 8418, "titulo": "Lang Lang y el drama de quedar segundo"}, {"inicio": 8458, "titulo": "Rankings escolares de suma cero"}, {"inicio": 8504, "titulo": "Empresas chinas compitiendo entre sí"}], "palabras_clave": ["competitividad", "Lang Lang", "rankings", "salud mental"], "resumen": "Lo mejor y lo peor es lo mismo: una competitividad feroz desde la escuela que los hace imparables pero que daña a los que quedan atrás.", "confianza": "alta"}, {"id": 38, "inicio": 8537, "fin": 8619, "tipo": "tema", "tema": "Xi Jinping, Putin y la longevidad", "subtemas": [], "palabras_clave": ["Xi Jinping", "Putin", "150 años", "biotecnología"], "resumen": "La conversación sobre vivir 150 años muestra que sin límites morales o regulatorios el avance tecnológico es mayor.", "confianza": "media"}, {"id": 39, "inicio": 8619, "fin": 8688, "tipo": "cierre", "tema": "Despedida", "subtemas": [], "palabras_clave": ["despedida", "suscripción"], "resumen": "Agradecimientos mutuos, invitación a seguir el canal del invitado y despedida 'a la china'.", "confianza": "alta"}], "corto": "Uri Sabat · Adrián Díaz", "capitulos": [], "evaluacion": null}]}</script>
<script>
const D = JSON.parse(document.getElementById("datos").textContent);
const C = D.colores;
const hms = t => { t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yt = (id, t) => `https://youtu.be/${id}?t=${Math.floor(t)}`;
const tip = document.getElementById("tip");

function barra(v, cls = "") {
  const d = v.duracion;
  return `<div class="bar ${cls}">` + v.segmentos.map(s => {
    const w = 100 * (s.fin - s.inicio) / d;
    return `<div class="seg" style="left:${100 * s.inicio / d}%;width:${w}%;background:${C[s.tipo]}"
      data-v="${v.video_id}" data-s="${s.id}"
      data-tip="${esc(`${s.id}. ${s.tema}\n${hms(s.inicio)} – ${hms(s.fin)} · ${s.tipo}`)}">${w > 2.2 ? s.id : ""}</div>`;
  }).join("") + "</div>";
}

function barraCapitulos(v) {
  const d = v.duracion, caps = v.capitulos;
  return `<div class="bar ref">` + caps.map((c, i) => {
    const fin = i + 1 < caps.length ? caps[i + 1].inicio : d, w = 100 * (fin - c.inicio) / d;
    return `<div class="seg" style="left:${100 * c.inicio / d}%;width:${w}%"
      data-tip="${esc(`YouTube: ${c.titulo}\n${hms(c.inicio)} – ${hms(fin)}`)}">${w > 3 ? i + 1 : ""}</div>`;
  }).join("") + "</div>";
}

function eje(d) {
  const paso = d > 7200 ? 1800 : d > 3600 ? 900 : 300, marcas = [];
  for (let t = 0; t <= d; t += paso) marcas.push(`<span style="left:${100 * t / d}%">${hms(t)}</span>`);
  return `<div class="axis">${marcas.join("")}</div>`;
}

const total = D.videos.reduce((a, v) => a + v.duracion, 0);
const nseg = D.videos.reduce((a, v) => a + v.segmentos.length, 0);
document.getElementById("resumen").textContent =
  `${D.videos.length} videos etiquetados · ${hms(total)} de contenido · ${nseg} segmentos · generado ${D.generado}`;
document.getElementById("leyenda").innerHTML =
  Object.entries(C).map(([t, c]) => `<span><i class="sw" style="background:${c}"></i>${t}</span>`).join("");

const maxDur = Math.max(...D.videos.map(v => v.duracion));
document.getElementById("comparada").innerHTML = D.videos.map(v => `
  <div class="vrow"><div class="name" title="${esc(v.titulo)}">${esc(v.corto)}</div>
  <div style="width:${100 * v.duracion / maxDur}%">${barra(v)}</div><div class="dur">${hms(v.duracion)}</div></div>`).join("");

document.getElementById("videos").innerHTML = D.videos.map(v => {
  const ev = v.evaluacion;
  const pills = [`<span class="pill">${esc(v.canal)}</span>`, `<span class="pill">${hms(v.duracion)}</span>`,
    `<span class="pill">${v.segmentos.length} segmentos</span>`, `<span class="pill">${esc(v.fuente_transcripcion)}</span>`,
    `<span class="pill">${esc(v.estado)}</span>`,
    ev ? `<span class="pill ok" title="Cortes de capítulos de YouTube que también están en el etiquetado (±30 s). F1=${ev["f1@30s"]}, Pk=${ev.pk}">Capítulos de YouTube encontrados: ${Math.round(ev.recall * ev.n_ref)}/${ev.n_ref} (±30 s)</span>` : ""].join("");
  const filas = v.segmentos.map(s => `
    <tr id="${v.video_id}-${s.id}">
      <td class="n">${s.id}</td>
      <td class="t"><a href="${yt(v.video_id, s.inicio)}" target="_blank">${hms(s.inicio)}</a> – ${hms(s.fin)}</td>
      <td class="k"><i class="sw" style="background:${C[s.tipo]}"></i>${s.tipo}</td>
      <td><b>${esc(s.tema)}</b>${s.confianza !== "alta" ? ` <span class="conf-${s.confianza}">confianza ${s.confianza}</span>` : ""}
        <div class="res">${esc(s.resumen)}</div>
        ${s.subtemas.length ? `<details><summary>${s.subtemas.length} subtemas</summary><ul class="st">${
          s.subtemas.map(st => `<li><a href="${yt(v.video_id, st.inicio)}" target="_blank">${hms(st.inicio)}</a> ${esc(st.titulo)}</li>`).join("")}</ul></details>` : ""}
        <div class="kw">${s.palabras_clave.map(esc).join(" · ")}</div></td>
    </tr>`).join("");
  return `<section class="card" id="${v.video_id}">
    <h2><a href="${yt(v.video_id, 0)}" target="_blank">${esc(v.titulo)}</a></h2>
    <div style="margin:6px 0 10px">${pills}</div>
    <p class="meta"><b>Formato:</b> ${esc(v.estructura.formato)}</p>
    <p class="meta"><b>Patrón:</b> ${esc(v.estructura.patron)}</p>
    <h3>Línea de tiempo</h3>
    ${v.capitulos.length ? '<div class="rowlabel">Etiquetado</div>' : ""}
    ${barra(v)}
    ${v.capitulos.length ? '<div class="rowlabel">Capítulos de YouTube (referencia)</div>' + barraCapitulos(v) : ""}
    ${eje(v.duracion)}
    <h3>Observaciones</h3><p class="meta">${esc(v.estructura.observaciones)}</p>
    <table>${filas}</table></section>`;
}).join("");

document.getElementById("pie").textContent =
  "Fuente: subtítulos de YouTube. Etiquetado según guia_etiquetado.md. Los tiempos enlazan al video en YouTube.";

document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip; tip.style.whiteSpace = "pre-line"; tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
});
document.addEventListener("click", e => {
  const el = e.target.closest(".seg[data-s]");
  if (!el) return;
  const fila = document.getElementById(`${el.dataset.v}-${el.dataset.s}`);
  document.querySelectorAll("tr.hl").forEach(r => r.classList.remove("hl"));
  fila.classList.add("hl");
  fila.scrollIntoView({behavior: "smooth", block: "center"});
});
</script>
